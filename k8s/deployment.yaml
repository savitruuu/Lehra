apiVersion: apps/v1
kind: Deployment
metadata:
  name: lehra-app
  namespace: lehra
  labels:
    app: lehra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lehra
  template:
    metadata:
      labels:
        app: lehra
    spec:
      containers:
      - name: lehra
        # Replace <YOUR_REGISTRY> with your container registry (e.g. docker.io/username, gcr.io/project, etc.)
        image: lehra:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
